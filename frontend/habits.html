<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habits — HabitSync</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="eyebrow-date" id="today-date"></div>
        <h1>Habits &amp; Todos</h1>
      </div>
      <div class="flex flex-gap">
        <button class="btn btn-outline" id="new-todo-btn">+ New todo</button>
        <button class="btn btn-primary" id="new-habit-btn">+ New habit</button>
      </div>
    </div>

    <div class="grid grid-2 habits-todos-grid">
      <div class="card">
        <div class="flex-between">
          <h2>Habits</h2>
        </div>
        <div id="habits-list"><div class="loading-row">Loading…</div></div>
      </div>

      <div class="card">
        <div class="flex-between">
          <h2>Todo list</h2>
        </div>
        <div class="flex flex-gap mt-1" style="margin-bottom:1rem;">
          <button class="btn btn-outline btn-sm todo-filter-btn active" data-status="pending">Pending</button>
          <button class="btn btn-outline btn-sm todo-filter-btn" data-status="overdue">Overdue</button>
          <button class="btn btn-outline btn-sm todo-filter-btn" data-status="completed">Completed</button>
        </div>
        <div id="todos-list"><div class="loading-row">Loading…</div></div>
      </div>
    </div>
  </main>
</div>

<!-- Create / edit habit modal -->
<div class="modal-overlay" id="habit-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="habit-modal-title">New habit</h2>
      <button class="icon-btn" onclick="UI.closeModal('habit-modal')">✕</button>
    </div>
    <form id="habit-form">
      <input type="hidden" id="habit-id" />
      <div class="field">
        <label for="habit-name">Name</label>
        <input type="text" id="habit-name" required placeholder="e.g. Study Java" />
      </div>
      <div class="field">
        <label for="habit-description">Description (optional)</label>
        <textarea id="habit-description" placeholder="Any notes about this habit"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="habit-target">Target</label>
          <input type="text" id="habit-target" placeholder="e.g. 2 hours" />
        </div>
        <div class="field">
          <label for="habit-frequency">Frequency</label>
          <select id="habit-frequency">
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="habit-reminder">Reminder time (optional)</label>
        <input type="time" id="habit-reminder" />
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="UI.closeModal('habit-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary" id="habit-submit-btn">Save habit</button>
      </div>
    </form>
  </div>
</div>

<!-- History modal -->
<div class="modal-overlay" id="history-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="history-modal-title">History</h2>
      <button class="icon-btn" onclick="UI.closeModal('history-modal')">✕</button>
    </div>
    <div id="history-summary" class="stat-sub mt-1"></div>
    <div id="history-list" class="mt-1"></div>
  </div>
</div>

<!-- Create / edit todo modal -->
<div class="modal-overlay" id="todo-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="todo-modal-title">New todo</h2>
      <button class="icon-btn" onclick="UI.closeModal('todo-modal')">✕</button>
    </div>
    <form id="todo-form">
      <input type="hidden" id="todo-id" />
      <div class="field">
        <label for="todo-title">Title</label>
        <input type="text" id="todo-title" required placeholder="e.g. Submit assignment" />
      </div>
      <div class="field">
        <label for="todo-description">Description (optional)</label>
        <textarea id="todo-description" placeholder="Any notes about this todo"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="todo-deadline-date">Deadline date</label>
          <input type="date" id="todo-deadline-date" required />
        </div>
        <div class="field">
          <label for="todo-deadline-time">Deadline time (optional)</label>
          <input type="time" id="todo-deadline-time" />
        </div>
      </div>
      <div class="field checkbox-field">
        <label class="checkbox-label">
          <input type="checkbox" id="todo-reminder-enabled" checked />
          <span>Remind me as the deadline approaches</span>
        </label>
        <div class="field-hint">You'll get a nudge ~2 days out, another ~5-6 hours out, then hourly in the final hour - only while this todo is incomplete.</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="UI.closeModal('todo-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary" id="todo-submit-btn">Save todo</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/notifications.js"></script>
<script src="js/habits.js"></script>
</body>
</html>
