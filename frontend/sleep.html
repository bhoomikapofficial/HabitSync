<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sleep — HabitSync</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="eyebrow-date" id="today-date"></div>
        <h1>Sleep</h1>
      </div>
      <button class="btn btn-primary" id="log-sleep-btn">+ Log sleep</button>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <div class="stat-label">Last night</div>
        <div class="stat-value mono" id="sleep-last">—</div>
        <div class="stat-sub" id="sleep-last-times">&nbsp;</div>
      </div>
      <div class="card">
        <div class="stat-label">7-day average</div>
        <div class="stat-value mono" id="sleep-avg">—</div>
        <div class="stat-sub" id="sleep-consistency">&nbsp;</div>
      </div>
    </div>

    <div class="card mt-2">
      <h3>Last 7 days</h3>
      <div class="chart-wrap small"><canvas id="sleep-chart"></canvas></div>
    </div>

    <div class="card mt-2">
      <h3>History</h3>
      <div id="sleep-list"><div class="loading-row">Loading…</div></div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="sleep-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="sleep-modal-title">Log sleep</h2>
      <button class="icon-btn" onclick="UI.closeModal('sleep-modal')">✕</button>
    </div>
    <form id="sleep-form">
      <input type="hidden" id="sleep-id" />
      <div class="field-row">
        <div class="field">
          <label for="sleep-date">Sleep date</label>
          <input type="date" id="sleep-date" required />
        </div>
        <div class="field">
          <label for="sleep-time-input">Sleep time</label>
          <input type="time" id="sleep-time-input" required />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="wake-date">Wake date</label>
          <input type="date" id="wake-date" required />
        </div>
        <div class="field">
          <label for="wake-time-input">Wake time</label>
          <input type="time" id="wake-time-input" required />
        </div>
      </div>
      <div class="field-hint">If you slept past midnight, set the wake date to the next day.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="UI.closeModal('sleep-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/sleep.js"></script>
</body>
</html>
