<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reminders — HabitSync</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="eyebrow-date" id="today-date"></div>
        <h1>Reminders</h1>
      </div>
      <button class="btn btn-primary" id="new-reminder-btn">+ New reminder</button>
    </div>

    <div class="flex flex-gap mt-1" style="margin-bottom:1rem;">
      <button class="btn btn-outline btn-sm filter-btn active" data-status="pending">Pending</button>
      <button class="btn btn-outline btn-sm filter-btn" data-status="completed">Completed</button>
      <button class="btn btn-outline btn-sm filter-btn" data-status="dismissed">Dismissed</button>
      <button class="btn btn-outline btn-sm filter-btn" data-status="">All</button>
    </div>

    <div class="card">
      <div id="reminders-list"><div class="loading-row">Loading…</div></div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="reminder-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="reminder-modal-title">New reminder</h2>
      <button class="icon-btn" onclick="UI.closeModal('reminder-modal')">✕</button>
    </div>
    <form id="reminder-form">
      <input type="hidden" id="reminder-id" />
      <div class="field">
        <label for="reminder-title">Title</label>
        <input type="text" id="reminder-title" required placeholder="e.g. Complete Java Test" />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="reminder-date">Date</label>
          <input type="date" id="reminder-date" required />
        </div>
        <div class="field">
          <label for="reminder-time">Time</label>
          <input type="time" id="reminder-time" required />
        </div>
      </div>
      <div class="field">
        <label for="reminder-repeat">Repeat</label>
        <select id="reminder-repeat">
          <option value="none">One-time</option>
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="monthly">Monthly</option>
          <option value="custom">Custom dates</option>
        </select>
      </div>

      <div class="field" id="weekly-days-field" style="display:none;">
        <label>Repeat on</label>
        <div class="weekday-picker">
          <button type="button" class="weekday-chip" data-day="0">Sun</button>
          <button type="button" class="weekday-chip" data-day="1">Mon</button>
          <button type="button" class="weekday-chip" data-day="2">Tue</button>
          <button type="button" class="weekday-chip" data-day="3">Wed</button>
          <button type="button" class="weekday-chip" data-day="4">Thu</button>
          <button type="button" class="weekday-chip" data-day="5">Fri</button>
          <button type="button" class="weekday-chip" data-day="6">Sat</button>
        </div>
        <div class="field-hint">Leave none selected to repeat weekly on the same weekday as the date above.</div>
      </div>

      <div class="field" id="custom-dates-field" style="display:none;">
        <label>Custom dates</label>
        <div class="custom-dates-list" id="custom-dates-list"></div>
        <button type="button" class="btn btn-outline btn-sm mt-1" id="add-custom-date-btn">+ Add date</button>
      </div>

      <div class="field" id="end-date-field" style="display:none;">
        <label for="reminder-end-date">End repeating on (optional)</label>
        <input type="date" id="reminder-end-date" />
      </div>

      <div class="field checkbox-field">
        <label class="checkbox-label">
          <input type="checkbox" id="reminder-notifications-enabled" checked />
          <span>Send browser notifications for this reminder</span>
        </label>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="UI.closeModal('reminder-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save reminder</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/notifications.js"></script>
<script src="js/reminders.js"></script>
</body>
</html>
