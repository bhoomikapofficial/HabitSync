<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expenses — HabitSync</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar" id="sidebar-root"></aside>

  <main class="main">
    <div class="page-header">
      <div>
        <div class="eyebrow-date" id="today-date"></div>
        <h1>Expenses</h1>
      </div>
      <div class="flex flex-gap">
        <button class="btn btn-outline btn-sm" id="edit-budget-btn">Set budget</button>
        <button class="btn btn-primary" id="new-expense-btn">+ Add expense</button>
      </div>
    </div>

    <div class="grid grid-3">
      <div class="card stat-card domain-expenses">
        <div class="stat-label">Today</div>
        <div class="stat-value mono" id="expense-today">—</div>
      </div>
      <div class="card stat-card domain-expenses">
        <div class="stat-label">This month</div>
        <div class="stat-value mono" id="expense-month">—</div>
      </div>
      <div class="card stat-card domain-expenses">
        <div class="stat-label">Monthly budget</div>
        <div class="stat-value mono" id="expense-budget">—</div>
        <div class="progress-track"><div class="progress-fill amber" id="budget-bar" style="width:0%"></div></div>
      </div>
    </div>

    <div class="card mt-2" id="budget-warning-card" style="display:none; border-color:var(--danger);">
      <p style="color:var(--danger); margin:0;" id="budget-warning-text"></p>
    </div>

    <div class="grid grid-2 mt-2">
      <div class="card">
        <h3>Spending by category (this month)</h3>
        <div class="chart-wrap small"><canvas id="category-chart"></canvas></div>
      </div>
      <div class="card">
        <h3>Daily spending (last 30 days)</h3>
        <div class="chart-wrap small"><canvas id="daily-chart"></canvas></div>
      </div>
    </div>

    <div class="card mt-2">
      <div class="flex-between">
        <h3>This month's expenses</h3>
        <select id="category-filter" style="padding:0.4em 0.6em; border-radius:5px; border:1px solid var(--line-strong);">
          <option value="">All categories</option>
        </select>
      </div>
      <div id="expenses-list"><div class="loading-row">Loading…</div></div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="expense-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="expense-modal-title">Add expense</h2>
      <button class="icon-btn" onclick="UI.closeModal('expense-modal')">✕</button>
    </div>
    <form id="expense-form">
      <input type="hidden" id="expense-id" />
      <div class="field-row">
        <div class="field">
          <label for="expense-amount">Amount (₹)</label>
          <input type="number" id="expense-amount" min="0" step="0.01" required />
        </div>
        <div class="field">
          <label for="expense-category">Category</label>
          <select id="expense-category">
            <option>Food</option>
            <option>Travel</option>
            <option value="Shopping/Materials">Shopping/Materials</option>
            <option>Education</option>
            <option>Entertainment</option>
            <option>Other</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="expense-date">Date</label>
        <input type="date" id="expense-date" required />
      </div>
      <div class="field">
        <label for="expense-description">Description (optional)</label>
        <input type="text" id="expense-description" placeholder="e.g. Lunch with friends" />
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="UI.closeModal('expense-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="budget-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>Monthly budget</h2>
      <button class="icon-btn" onclick="UI.closeModal('budget-modal')">✕</button>
    </div>
    <form id="budget-form">
      <div class="field">
        <label for="budget-amount">Budget (₹)</label>
        <input type="number" id="budget-amount" min="0" step="0.01" required />
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" onclick="UI.closeModal('budget-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/notifications.js"></script>
<script src="js/expenses.js"></script>
</body>
</html>
